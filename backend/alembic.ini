# Alembic configuration file for AI Reading Coach.
# The actual database URL is injected from application settings inside
# `alembic/env.py`, so the value below is only a placeholder.

[alembic]
script_location = alembic

# Template used for new migration scripts.
prepend_sys_path = .
version_path_separator = os

# Placeholder URL; overridden at runtime by `alembic/env.py`.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/ai_reading_coach

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
